{% extends 'base.html' %}

{% block title %}Editar Questão{% endblock %}

{% block content %}
<h1>Editar Questão</h1>

<!-- Container invisível apenas para armazenar os dados vindos do backend de forma segura -->
<div id="dados-iniciais" style="display: none;">
    {% for alt in alternativas %}
    <div class="alt-data" data-id="{{ alt['id'] }}" data-texto="{{ alt['alternativa'] }}" data-correta="{{ alt['is_correct'] }}"></div>
    {% endfor %}
</div>

<form method="post">
    <label for="enunciado">Enunciado da Questão</label>
    <textarea name="enunciado" id="enunciado" rows="6" required>{{ request.form['enunciado'] or questao['enunciado'] }}</textarea>

    <h3>Alternativas (Marque a bolinha da correta)</h3>
    <div id="alt-container" style="margin-bottom: 15px;">
        <!-- As alternativas serão injetadas aqui via JS puro -->
    </div>

    <button type="button" class="btn" onclick="adicionarAlternativa()">+ Adicionar Alternativa</button>

    <div style="margin-top: 20px;">
        <input type="submit" value="Salvar Alterações">
        <a class="action" href="{{ url_for('blog.listar_questoes', prova_id=questao['prova_id_fk']) }}">Cancelar</a>
    </div>
</form>

<script>
    const altContainer = document.getElementById('alt-container');

    function carregarAlternativasIniciais() {
        const elementosDados = document.querySelectorAll('.alt-data');
        const alternativasExistentes = [];

        elementosDados.forEach(el => {
            alternativasExistentes.push({
                id: el.getAttribute('data-id'),
                texto: el.getAttribute('data-texto'),
                is_correct: parseInt(el.getAttribute('data-correta'))
            });
        });

        altContainer.innerHTML = '';

        if (alternativasExistentes.length > 0) {
            alternativasExistentes.forEach((alt, index) => {
                criarLinhaAlternativa(alt.texto, alt.is_correct === 1, index);
            });
        } else {
            // Se vier vazio, cria duas linhas em branco padrão (primeira marcada como correta)
            criarLinhaAlternativa('', true, 0);
            criarLinhaAlternativa('', false, 1);
        }
    }

    function criarLinhaAlternativa(texto = '', isCorrect = false, index = null) {
        const altCount = altContainer.children.length;
        if (altCount >= 6) {
            alert("Máximo de 6 alternativas por questão.");
            return;
        }

        const idx = index !== null ? index : altCount;
        const letra = String.fromCharCode(65 + idx);
        
        const altDiv = document.createElement('div');
        altDiv.className = 'row-alt';
        altDiv.style.cssText = "display: flex; align-items: center; margin-bottom: 8px;";
        
        altDiv.innerHTML = `
            <input type="radio" name="alternativa_correta" value="${idx}" ${isCorrect ? 'checked' : ''} title="Marcar como alternativa correta" style="width: auto; margin-right: 10px;" required>
            <span style="margin-right: 5px; font-weight: bold;">${letra})</span>
            <input type="text" name="alternativas[]" value="${texto}" placeholder="Texto da alternativa ${letra}" required style="flex: 1; margin: 0; padding: 6px;">
            <button type="button" class="btn-remove" onclick="removerAlternativa(this)" style="margin-left: 5px; background: #dc3545; color: white; border: none; padding: 6px 10px; cursor: pointer;">✕</button>
        `;
        
        altContainer.appendChild(altDiv);
    }

    function adicionarAlternativa() {
        criarLinhaAlternativa('', false);
        atualizarIndices();
    }

    function removerAlternativa(btn) {
        if (altContainer.children.length <= 2) {
            alert("Cada questão deve ter pelo menos 2 alternativas.");
            return;
        }
        btn.parentElement.remove();
        atualizarIndices();
    }

    function atualizarIndices() {
        Array.from(altContainer.children).forEach((row, idx) => {
            const span = row.querySelector('span');
            const radio = row.querySelector('input[type="radio"]');
            const letra = String.fromCharCode(65 + idx);
            span.innerText = letra + ')';
            radio.value = idx;
        });
    }

    // Inicializa o carregamento puro via JS ao abrir a página
    window.onload = function() {
        carregarAlternativasIniciais();
    };
</script>
{% endblock %}
